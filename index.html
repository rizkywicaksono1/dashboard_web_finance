        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // INITIAL FINANCES

// --- UTILS ---
        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
        };
        const formatShortRupiah = (angka) => {
            if (angka >= 1000000000) return (angka / 1000000000).toFixed(1) + ' M';
            if (angka >= 1000000) return (angka / 1000000).toFixed(1) + ' Jt';
            if (angka >= 1000) return (angka / 1000).toFixed(0) + ' Rb';
            return angka || '0';
        };
        const formatDate = (dateString) => {
            if (!dateString) return '-';
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const d = new Date(dateString);
            return isNaN(d.getTime()) ? dateString : d.toLocaleDateString('id-ID', options);
        };

        // Parse CSV text into array of finance items
        // Fungsi normalisasi tanggal ke format ISO YYYY-MM-DD
        const normalizeDateStr = (raw) => {
            if (!raw) return '';
            const trimmed = String(raw).trim();
            const parts = trimmed.split(/[/\-]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                }
                if (parts[2].length === 4) {
                    const y = parts[2];
                    const p0 = Number(parts[0]);
                    const p1 = Number(parts[1]);
                    if (p0 > 12) {
                        return `${y}-${String(p1).padStart(2, '0')}-${String(p0).padStart(2, '0')}`;
                    }
                    return `${y}-${String(p0).padStart(2, '0')}-${String(p1).padStart(2, '0')}`;
                }
            }
            const dt = new Date(trimmed);
            if (!isNaN(dt.getTime())) {
                const y = dt.getFullYear();
                const m = String(dt.getMonth() + 1).padStart(2, '0');
                const d = String(dt.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            return trimmed;
        };

        const parseCSVToFinances = (csvText) => {
            const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length <= 1) return [];

            const parsedData = [];
            const delimiter = lines[0].includes(';') ? ';' : ',';

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(delimiter).map(c => c.trim().replace(/^"|"$/g, ''));
                if (cols.length >= 5) {
                    const typeRaw = cols[1].toLowerCase();
                    const isIncome = typeRaw === 'income' || typeRaw === 'pemasukan' || typeRaw === 'masuk';
                    parsedData.push({
                        id: Date.now() + i,
                        date: normalizeDateStr(cols[0]),
                        type: isIncome ? 'income' : 'expense',
                        category: cols[2] || 'Umum',
                        desc: cols[3] || 'Tanpa Keterangan',
                        amount: Number(cols[4].replace(/[^0-9]/g, '')) || 0,
                        status: 'Selesai'
                    });
                }
            }
            return parsedData;
        };

        // Aggregate monthly totals dynamically for selected year or all years
        const computeMonthlyData = (financesList, selectedYear) => {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            const monthlyStats = months.map(m => ({ month: m, income: 0, expense: 0 }));

            if (!Array.isArray(financesList)) return monthlyStats;

            financesList.forEach(item => {
                if (!item) return;
                const itemDate = new Date(item.date);
                if (!isNaN(itemDate.getTime())) {
                    const isMatchYear = selectedYear === 'all' || itemDate.getFullYear().toString() === String(selectedYear);
                    if (isMatchYear) {
                        const monthIdx = itemDate.getMonth();
                        if (monthIdx >= 0 && monthIdx < 12) {
                            const amt = Number(item.amount) || 0;
                            if (item.type === 'income') {
                                monthlyStats[monthIdx].income += amt;
                            } else if (item.type === 'expense') {
                                monthlyStats[monthIdx].expense += amt;
                            }
                        }
                    }
                }
            });

            return monthlyStats;
        };

        const FinancialLineChart = ({ data, selectedYear, onYearChange }) => {
            const [hoveredIndex, setHoveredIndex] = useState(null);

            const width = 650;
            const height = 260;
            const padding = { top: 25, right: 30, bottom: 40, left: 55 };

            const innerWidth = width - padding.left - padding.right;
            const innerHeight = height - padding.top - padding.bottom;

            const maxVal = useMemo(() => {
                const maxIn = Math.max(...data.map(d => d.income), 0);
                const maxOut = Math.max(...data.map(d => d.expense), 0);
                const peak = Math.max(maxIn, maxOut);
                return peak === 0 ? 10000000 : Math.ceil((peak * 1.15) / 1000000) * 1000000;
            }, [data]);

            const getX = (index) => padding.left + (index * (innerWidth / (data.length - 1 || 1)));
            const getY = (val) => padding.top + innerHeight - ((val / maxVal) * innerHeight);

            const incomePoints = data.map((d, i) => `${getX(i)},${getY(d.income)}`).join(' ');
            const expensePoints = data.map((d, i) => `${getX(i)},${getY(d.expense)}`).join(' ');

                                value={selectedYear}
                                onChange={(e) => onYearChange(e.target.value)}

                            >
                                <option value="2030">Tahun 2030</option>
                                <option value="2029">Tahun 2029</option>
                                <option value="2028">Tahun 2028</option>
                                <option value="2027">Tahun 2027</option>
                                <option value="2026">Tahun 2026</option>
                                <option value="2025">Tahun 2025</option>
                            </select>
                        </div>
                    </div>

                        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto min-w-[550px] overflow-visible">
                            {[0, 0.25, 0.5, 0.75, 1].map((ratio, idx) => {
                                const yVal = maxVal * (1 - ratio);
                                const yPos = padding.top + (innerHeight * ratio);
                                return (
                                    <g key={idx}>
                                        <line 
                                            x1={padding.left} 
                                            y1={yPos} 
                                            x2={width - padding.right}

                                points={expensePoints}

                                const x = getX(i);

                                const yOut = getY(d.expense);
                                const isHovered = hoveredIndex === i;

                                return (
                                    <g key={i} className="cursor-pointer" onMouseEnter={() => setHoveredIndex(i)} onMouseLeave={() => setHoveredIndex(null)}>

                                    </p>
                                    <p className="flex justify-between gap-4 text-rose-400">
                                        <span>Pengeluaran:</span>
                                        <span className="font-semibold">{formatRupiah(data[hoveredIndex].expense)}</span>
                                    </p>
                                    <p className="flex justify-between gap-4 text-blue-300 pt-1 border-t border-gray-800">
                                        <span>Net Kas:</span>
                                        <span className="font-bold">{formatRupiah(data[hoveredIndex].income - data[hoveredIndex].expense)}</span>
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>
                </Card>
            );
        };

}) => {

                    let res = await fetch(`${API_BASE}/login`, { method: 'POST', headers, body: payload });

                        res = await fetch(`${API_BASE}/api/login`, { method: 'POST', headers, body: payload });

                        data = JSON.parse(rawText);

                        data = { error: `Server merespon (HTTP ${res.status}): ${rawText.slice(0, 100)}` };

            alert('Gagal menghapus data di database');
        }
    } catch (err) {
        console.error(err);
        alert('Gagal terhubung ke server');
    }
};
            const handleImportFinances = (newTransactions) => {
                setFinances(prev => [...newTransactions, ...prev]);
            };

            const handleAddSingleFinance = async (item) => {
    try {
        // Kirim data ke server
        const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(item)
        });
        
        if (response.ok) {
            const savedItem = await response.json();
            // Update tampilan di layar
            setFinances(prev => [savedItem, ...prev]); 
        }
    } catch (error) {
        console.error("Gagal menyimpan data ke server", error);
        alert("Gagal menyimpan transaksi!");
    }
};

           const handleAddMember = async (newMember) => {
    try {
        const res = await fetch(API_BASE + '/members', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newMember)
        });
        const saved = await res.json();
        if (res.ok) setMembers(prev => [saved, ...prev]);
        else alert(saved.error);
    } catch (err) {
        alert('Gagal menambah anggota');
    }
};

           const handleToggleMemberStatus = async (memberId) => {
    try {
        const res = await fetch(API_BASE + `/members/${memberId}/toggle-status`, { method: 'PATCH' });
        const updated = await res.json();
        setMembers(prev => prev.map(m => m.id === memberId ? updated : m));
    } catch (err) {
        alert('Gagal mengubah status');
    }
};

           const handleDeleteMember = async (memberId, memberName) => {
               if (!window.confirm(`Hapus anggota/user "${memberName || memberId}"? Akun login dan data profil ini akan dihapus permanen.`)) return;
               try {
                   const res = await fetch(`${API_BASE}/members/${memberId}`, { method: 'DELETE' });
                   const data = await res.json();
                   if (res.ok) {
                       setMembers(prev => prev.filter(m => m.id !== memberId));
                       alert('Anggota & akun login berhasil dihapus.');
                   } else {
                       alert(data.error || 'Gagal menghapus anggota');
                   }
               } catch (err) {
                   console.error(err);
                   alert('Gagal terhubung ke server');
               }
           };


            const NAV_ITEMS = [
                { id: 'dashboard', label: 'Dashboard Keuangan', icon: <IconHome />, roles: ['admin', 'user'] },
                { id: 'agenda', label: 'Agenda', icon: <IconCalendar />, roles: ['admin', 'user'] },
                { id: 'rakor', label: 'Hasil Rakor', icon: <IconFileSpreadsheet />, roles: ['admin', 'user'] },
                { id: 'suggestions', label: 'Kotak Saran', icon: <IconMessageSquare />, roles: ['admin', 'user'] },
                { id: 'members', label: 'Anggota', icon: <IconUsers />, roles: ['admin'] },
            ];

            // Normalisasi role backend agar akun dengan role 'Anggota'/'member'
            // tetap melihat menu untuk pengguna biasa, termasuk Agenda.
            const normalizedUserRole = String(user?.role || '').trim().toLowerCase();
            const navRole = ['admin', 'administrator', 'pengurus'].includes(normalizedUserRole)
                ? 'admin'
                : ['user', 'anggota', 'member'].includes(normalizedUserRole)
                    ? 'user'
                    : normalizedUserRole;
            const allowedNavItems = NAV_ITEMS.filter(item => item.roles.includes(navRole));
            const currentItem = NAV_ITEMS.find(i => i.id === currentView) || NAV_ITEMS[0];

            return (
                <div className="flex h-screen overflow-hidden bg-gray-50 relative">
                    {saveToast && (
                        <div className="pointer-events-none fixed right-4 top-24 z-[70] w-[min(24rem,calc(100vw-2rem))] animate-fade-in" role="status" aria-live="polite">
                            <div className="pointer-events-auto flex items-start gap-3 rounded-2xl border border-emerald-200 bg-white p-4 shadow-xl shadow-emerald-900/10 ring-1 ring-black/5">
                                <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">
                                    <svg className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                        <path d="m5 12 4 4L19 6" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                                    </svg>
                                </div>
                                <div className="min-w-0 flex-1 pt-0.5">
                                    <p className="text-sm font-bold text-gray-900">Berhasil</p>
                                    <p className="mt-0.5 text-xs leading-5 text-gray-600">{saveToast.message}</p>
                                </div>
                                <button type="button" aria-label="Tutup notifikasi" onClick={() => setSaveToast(null)} className="-mr-1 -mt-1 rounded-lg p-2 text-gray-400 transition hover:bg-gray-100 hover:text-gray-700">
                                    <IconX />
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {/* BACKDROP */}
                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-40 transition-opacity duration-300"
                            onClick={() => setIsSidebarOpen(false)}
                        />
                    )}

                    {/* SIDEBAR */}
                    <aside className={`fixed top-0 left-0 bottom-0 w-72 bg-union-900 text-white shadow-2xl z-50 flex flex-col transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="flex items-center justify-between h-20 px-6 border-b border-union-800">
                            <div className="flex items-center gap-2">
                                <img
                                    src="/serikat_dashboard/logo.png"
                                    alt="Logo SP-ER"
                                    className="w-8 h-8 rounded-md object-contain bg-white p-1"
                                    onError={(e) => { e.currentTarget.style.display = 'none'; }}
                                />
                                <h1 className="text-lg font-bold tracking-wider">SP-ER DASHBOARD</h1>
                            </div>
                            <button onClick={() => setIsSidebarOpen(false)} className="p-1.5 rounded-lg text-union-300 hover:text-white">
                                <IconX />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto py-4 px-4 space-y-1 hide-scroll">
                            <p className="text-[11px] font-semibold text-union-300 uppercase tracking-wider px-3 mb-2">Menu Navigasi</p>
                            {allowedNavItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => {
                                        setCurrentView(item.id);
                                        setIsSidebarOpen(false);
                                    }}
                                    className={`w-full flex items-center gap-3.5 px-4 py-3 text-sm font-medium rounded-xl transition-all ${currentView === item.id ? 'bg-union-800 text-white shadow-md' : 'text-union-100 hover:bg-union-800/60 hover:text-white'}`}
                                >
                                    {item.icon}
                                    <span>{item.label}</span>
                                </button>
                            ))}
                        </div>

                        <div className="p-4 border-t border-union-800 bg-union-950/40">
                            <div className="flex items-center gap-3 mb-3">
                                <div className="w-9 h-9 rounded-full bg-union-700 flex items-center justify-center font-bold text-white text-xs">
                                    {user.name.charAt(0)}
                                </div>
                                <div className="overflow-hidden">
                                    <p className="text-xs font-bold truncate text-white">{user.name}</p>
                                    <p className="text-[10px] text-union-300 capitalize">{user.role}</p>
                                </div>
                            </div>
                            <div className="flex flex-col gap-1.5">
                                <button 
                                    onClick={onLogout} 
                                    className="w-full flex items-center justify-center gap-2 px-3 py-2 text-xs font-medium text-rose-200 bg-rose-500/20 hover:bg-rose-500/30 rounded-lg transition-colors"
                                >
                                    <IconLogOut /> Keluar
                                </button>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 flex flex-col relative w-full overflow-hidden">
                        
                        <header className="h-20 bg-white shadow-sm border-b border-gray-100 flex items-center justify-between px-4 sm:px-8 z-30">
                            <div className="flex items-center gap-3 sm:gap-4">
                                <button 
                                    onClick={() => setIsSidebarOpen(true)} 
                                    className="flex items-center gap-2 bg-union-50 hover:bg-union-100 text-union-900 border border-union-200 px-3 py-2 rounded-xl text-xs font-bold transition-all"
                                >
                                    <IconMenu />
                                    <span className="hidden sm:inline">Menu</span>
                                </button>

                                <div className="flex items-center gap-2 pl-2 border-l border-gray-200">
                                    <span className="text-gray-900 font-bold text-base flex items-center gap-2">
                                        {currentItem?.icon}
                                        {currentItem?.label}
                                    </span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2.5 sm:gap-3">
                                <button
                                    onClick={() => setIsChangePasswordOpen(true)}
                                    title="Ganti Password Akun"
                                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-union-900 bg-union-50 hover:bg-union-100 border border-union-200 transition-all shadow-sm cursor-pointer"
                                >
                                    <IconLock />
                                    <span>Ganti Password</span>
                                </button>

                                <div className="flex items-center gap-2.5 pl-2.5 border-l border-gray-200">
                                    <div className="w-8 h-8 rounded-full bg-union-900 text-white font-bold flex items-center justify-center text-xs shadow-sm">
                                        {user.name.charAt(0)}
                                    </div>
                                    <div className="text-left leading-tight hidden sm:block">
                                        <p className="text-xs font-bold text-gray-800">{user.name}</p>
                                        <p className="text-[10px] text-gray-500 capitalize">{user.role}</p>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pb-24 md:pb-8">
                            <div className="max-w-6xl mx-auto">
                                {currentView === 'dashboard' && (() => {
                                    const roleName = String(user?.role || '').trim().toLowerCase();
                                    const isMemberAccount = !['admin', 'administrator', 'pengurus'].includes(roleName);
                                    const unreadRakorResults = isMemberAccount
                                        ? rakorResults.filter(item => !readRakorIds.includes(String(item.id)))
                                        : [];
                                    const showSuggestionNotice = isMemberAccount && !isSuggestionNoticeDismissed;
                                    if (!newAgendaNotice.length && !unreadRakorResults.length && !showSuggestionNotice) return null;
                                    const agenda = newAgendaNotice[0];
                                    const rakor = unreadRakorResults[0];
                                    return (
                                        ReactDOM.createPortal(
                                        <div className="pointer-events-none fixed right-3 top-20 z-[80] flex w-[min(24rem,calc(100vw-1.5rem))] flex-col items-end gap-3 overflow-visible box-border sm:right-4 sm:top-24 sm:w-[min(24rem,calc(100vw-2rem))]" role="status" aria-live="polite">
                                            {showSuggestionNotice && (
                                                <section
                                                    data-suggestion-notice-card="true"
                                                    style={{ transform: `translate3d(${suggestionNoticePosition.x}px, ${suggestionNoticePosition.y}px, 0)` }}
                                                    className="pointer-events-auto relative box-border w-full min-w-0 touch-none rounded-xl border border-indigo-200 bg-white p-4 pr-12 shadow-lg [overflow-wrap:anywhere]"
                                                >
                                                    <div
                                                        onPointerDown={handleSuggestionNoticePointerDown}
                                                        onPointerMove={handleSuggestionNoticePointerMove}
                                                        onPointerUp={handleSuggestionNoticePointerUp}
                                                        onPointerCancel={handleSuggestionNoticePointerUp}
                                                        className="mb-2 cursor-move select-none text-[10px] font-medium text-gray-400"
                                                        title="Geser kotak ini"
                                                    >Geser kotak Kotak Saran</div>
                                                    <button type="button" aria-label="Tutup Kotak Saran" title="Tutup" onClick={() => setIsSuggestionNoticeDismissed(true)} className="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-900"><IconX /></button>
                                                    <p className="text-[11px] font-bold uppercase tracking-wide text-indigo-700">Ada masukan untuk pengurus?</p>
                                                    <h3 className="mt-1 text-sm font-bold text-gray-900">Kotak Saran</h3>

                                                    <button type="button" onClick={() => { setCurrentView('suggestions'); setIsSidebarOpen(false); }} className="mt-3 rounded-lg bg-union-900 px-3 py-2 text-xs font-semibold text-white hover:bg-union-800">Buka Kotak Saran</button>
                                                </section>
                                            )}
                                            {agenda && (
                                                <section
                                                    data-agenda-notice-card="true"
                                                    style={{ transform: `translate3d(${agendaNoticePosition.x}px, ${agendaNoticePosition.y}px, 0)` }}
                                                    className="pointer-events-auto relative box-border w-full min-w-0 touch-none rounded-xl border border-blue-200 bg-white p-4 pr-12 shadow-lg [overflow-wrap:anywhere]"
                                                >
                                                    <div
                                                        onPointerDown={handleAgendaNoticePointerDown}
                                                        onPointerMove={handleAgendaNoticePointerMove}
                                                        onPointerUp={handleAgendaNoticePointerUp}
                                                        onPointerCancel={handleAgendaNoticePointerUp}
                                                        className="mb-2 cursor-move select-none text-[10px] font-medium text-gray-400"
                                                        title="Geser notifikasi ke posisi lain"
                                                    >Geser notifikasi agenda</div>
                                                    <button type="button" aria-label="Tutup notifikasi agenda ini" title="Tutup" onClick={() => dismissAgendaNotice(agenda)} className="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-900"><IconX /></button>
                                                    <p className="text-[11px] font-bold uppercase tracking-wide text-blue-700">Agenda mendatang</p>
                                                    <h3 className="mt-1 text-sm font-bold text-gray-900">{agenda.title || 'Agenda kegiatan'}</h3>
                                                    <p className="mt-1 text-xs text-gray-600">{agenda.date ? formatDate(agenda.date) : 'Tanggal belum ditentukan'}{agenda.time ? ` • ${agenda.time}` : ' • Jam belum ditentukan'}</p>
                                                    {agenda.location && <p className="mt-1 text-xs text-gray-500">Lokasi: {agenda.location}</p>}
                                                    {newAgendaNotice.length > 1 && <p className="mt-1 text-[11px] text-gray-500">+{newAgendaNotice.length - 1} agenda mendatang lainnya</p>}
                                                    <button type="button" onClick={() => { setCurrentView('agenda'); setIsSidebarOpen(false); }} className="mt-3 rounded-lg bg-union-900 px-3 py-2 text-xs font-semibold text-white hover:bg-union-800">Lihat agenda</button>
                                                </section>
                                            )}
                                            {rakor && (
                                                <section
                                                    data-agenda-notice-card="true"
                                                    style={{ transform: `translate3d(${agendaNoticePosition.x}px, ${agendaNoticePosition.y}px, 0)` }}
                                                    className="pointer-events-auto relative box-border w-full min-w-0 touch-none rounded-xl border border-amber-200 bg-white p-4 pr-12 shadow-lg [overflow-wrap:anywhere]"
                                                >
                                                    <div
                                                        onPointerDown={handleAgendaNoticePointerDown}
                                                        onPointerMove={handleAgendaNoticePointerMove}
                                                        onPointerUp={handleAgendaNoticePointerUp}
                                                        onPointerCancel={handleAgendaNoticePointerUp}
                                                        className="mb-2 cursor-move select-none text-[10px] font-medium text-gray-400"
                                                        title="Geser notifikasi ke posisi lain"
                                                    >Geser notifikasi hasil rakor</div>
                                                    <button type="button" aria-label="Tandai hasil rakor sudah dibaca" title="Tandai sudah dibaca" onClick={() => markRakorAsRead(rakor)} className="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-900"><IconX /></button>
                                                    <p className="text-[11px] font-bold uppercase tracking-wide text-amber-700">Hasil rakor baru</p>
                                                    <h3 className="mt-1 text-sm font-bold text-gray-900">{rakor.title || 'Hasil rapat koordinasi'}</h3>
                                                    <p className="mt-1 text-xs text-gray-600">{rakor.date ? formatDate(rakor.date) : 'Tanggal rakor belum ditentukan'}</p>
                                                    <p className="mt-2 line-clamp-4 whitespace-pre-wrap text-xs leading-5 text-gray-700">{rakor.summary || 'Ringkasan belum tersedia.'}</p>
                                                    {unreadRakorResults.length > 1 && <p className="mt-1 text-[11px] text-gray-500">+{unreadRakorResults.length - 1} hasil rakor belum dibaca</p>}
                                                    <div className="mt-3 flex items-center gap-2">
                                                        <button type="button" onClick={() => { markRakorAsRead(rakor); setCurrentView('rakor'); setIsSidebarOpen(false); }} className="rounded-lg bg-union-900 px-3 py-2 text-xs font-semibold text-white hover:bg-union-800">Lihat hasil rakor</button>
                                                        <button type="button" onClick={() => markRakorAsRead(rakor)} className="rounded-lg border border-gray-200 px-3 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-50">Sudah dibaca</button>
                                                    </div>
                                                </section>
                                            )}
                                        </div>,
                                        document.body
                                        )
                                    );
                                })()}
                                {currentView === 'dashboard' && (
                                    <>
                                        <DashboardView 
                                            user={user} 
                                            finances={finances} 
                                            selectedYear={selectedYear} 
                                            setSelectedYear={setSelectedYear} 
                                            onOpenLiveSync={() => setIsLiveSyncModalOpen(true)}
                                            onOpenImport={() => setIsImportModalOpen(true)}
                                            onOpenAdd={() => setIsAddModalOpen(true)}
                                            syncUrl={syncUrl}
                                            onSyncNow={handleSyncNow}
                                            isSyncing={isSyncing}
                                            lastSyncTime={lastSyncTime}
                                            onClearAll={handleClearAll}
                                            onDeleteFinance={handleDeleteFinance}
                                            onBulkDeleteFinances={handleBulkDeleteFinances}
                                        />
                                    </>
                                )}
                                {currentView === 'suggestions' && (
                                    isAdminUser ? (
                                        <SuggestionsView suggestions={suggestions} error={suggestionsError} onRefresh={fetchSuggestions} />
                                    ) : (
                                        <div className="mx-auto max-w-4xl space-y-4">
                                            <div>
                                                <h1 className="text-2xl font-bold text-gray-800">Kotak Saran</h1>
                                                <p className="mt-1 text-xs leading-5 text-gray-500">Sampaikan masukan kepada pengurus melalui formulir berikut.</p>
                                            </div>
                                            <SuggestionBox user={user} onSubmit={handleSubmitSuggestion} />
                                        </div>
                                    )
                                )}
                                {currentView === 'agenda' && (
                                    <AgendaView 
                                        user={user} 
                                        agendas={agendas} 
                                        onOpenAddAgenda={() => setIsAddAgendaModalOpen(true)}
                                        onOpenEditAgenda={(ag) => {
                                            setSelectedAgendaForEdit(ag);
                                            setIsEditAgendaModalOpen(true);
                                        }}
                                        onDeleteAgenda={handleDeleteAgenda}
                                    />
                                )}
                                {currentView === 'rakor' && (
                                    <RakorView
                                        user={user}
                                        results={rakorResults}
                                        onAdd={() => { setSelectedRakorForEdit(null); setIsRakorModalOpen(true); }}
                                        onEdit={(item) => { setSelectedRakorForEdit(item); setIsRakorModalOpen(true); }}
                                        onDelete={handleDeleteRakorResult}
                                    />
                                )}
                                {currentView === 'members' && (
                                    <MembersView 
                                        user={user} 
                                        members={members} 
                                        onOpenAddMember={() => setIsAddMemberModalOpen(true)} 
                                        onOpenEditMember={(m) => {
                                            setSelectedMemberForEdit(m);
                                            setIsEditMemberModalOpen(true);
                                        }}
                                        onToggleStatus={handleToggleMemberStatus} 
                                        onDeleteMember={handleDeleteMember}
                                    />
                                )}
                            </div>
                        </main>
                    </div>

                    {/* MODALS */}
                    <LiveExcelModal 
                        isOpen={isLiveSyncModalOpen}
                        onClose={() => setIsLiveSyncModalOpen(false)}
                        syncUrl={syncUrl}
                        onSaveSyncUrl={handleSaveSyncUrl}
                        onSyncNow={handleSyncNow}
                        isSyncing={isSyncing}
                    />

                    <ExcelImportModal 
                        isOpen={isImportModalOpen} 
                        onClose={() => setIsImportModalOpen(false)} 
                        onImport={handleImportFinances} 
                    />

                    <ManualAddModal 
                        isOpen={isAddModalOpen}
                        onClose={() => setIsAddModalOpen(false)}
                        onAdd={handleAddSingleFinance}
                    />

                    <AddMemberModal 
                        isOpen={isAddMemberModalOpen} 
                        onClose={() => setIsAddMemberModalOpen(false)} 
                        onAddMember={handleAddMember} 
                    />

                    <AddAgendaModal
                        isOpen={isAddAgendaModalOpen}
                        onClose={() => setIsAddAgendaModalOpen(false)}
                        onAddAgenda={handleAddAgenda}
                    />

                    <EditAgendaModal
                        isOpen={isEditAgendaModalOpen}
                        onClose={() => {
                            setIsEditAgendaModalOpen(false);
                            setSelectedAgendaForEdit(null);
                        }}
                        agenda={selectedAgendaForEdit}
                        onUpdateAgenda={handleUpdateAgenda}
                    />

                    <EditMemberModal
                        isOpen={isEditMemberModalOpen}
                        onClose={() => {
                            setIsEditMemberModalOpen(false);
                            setSelectedMemberForEdit(null);
                        }}
                        member={selectedMemberForEdit}
                        onUpdateMember={handleUpdateMember}
                    />

                    <RakorModal
                        isOpen={isRakorModalOpen}
                        onClose={() => { setIsRakorModalOpen(false); setSelectedRakorForEdit(null); }}
                        onSave={handleSaveRakorResult}
                        result={selectedRakorForEdit}
                    />

                    <ChangePasswordModal 
                        isOpen={isChangePasswordOpen}
                        onClose={() => setIsChangePasswordOpen(false)}
                        user={user}
                    />
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);

            useEffect(() => {
                // Hapus sesi persisten versi lama agar aplikasi meminta login ulang.
                localStorage.removeItem('sp_user');
                const storedUser = sessionStorage.getItem('sp_user');
                if (storedUser) {
                    try { setUser(JSON.parse(storedUser)); }
                    catch (e) { sessionStorage.removeItem('sp_user'); }
                }
            }, []);

            const handleLogin = (userData) => {
                setUser(userData);
                // Sesi tersimpan hanya untuk tab ini dan berakhir ketika tab/browser ditutup.
                sessionStorage.setItem('sp_user', JSON.stringify(userData));
                localStorage.removeItem('sp_user');
            };

            const handleLogout = () => {
                setUser(null);
                sessionStorage.removeItem('sp_user');
                localStorage.removeItem('sp_user');
            };

            if (!user) {
                return <Login onLogin={handleLogin} />;
            }

            return <MainLayout user={user} onLogout={handleLogout} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
